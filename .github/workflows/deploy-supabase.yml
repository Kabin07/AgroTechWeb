# Deploys the Supabase Edge Functions and their secrets.
# Repo Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_ACCESS_TOKEN  (required) supabase.com → Account → Access Tokens
#   DATA_GOV_API_KEY       (live mandi prices) data.gov.in → My Account → API key
#   ANTHROPIC_API_KEY      (AI chat replies)   console.anthropic.com
#   CRON_SECRET            (any long random text; protects the scheduled price refresh)
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

env:
  PROJECT_REF: fwyxcnytpclcyjmsbojn

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Skipping: add the SUPABASE_ACCESS_TOKEN repository secret (see the top of this file)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set function secrets (only those provided)
        if: steps.token.outputs.ready == 'true'
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          args=()
          [ -n "$DATA_GOV_API_KEY" ] && args+=("DATA_GOV_API_KEY=$DATA_GOV_API_KEY")
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$CRON_SECRET" ] && args+=("CRON_SECRET=$CRON_SECRET")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
          else
            echo "::warning::No function secrets provided; prices will use saved data and chat will use built-in replies."
          fi
      - name: Deploy functions
        if: steps.token.outputs.ready == 'true'
        run: |
          supabase functions deploy market-prices --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy assistant --project-ref "$PROJECT_REF" --no-verify-jwt
