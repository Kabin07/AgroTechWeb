name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - name: Production build (lint warnings fail the build)
        run: npm run build
        env:
          CI: true
